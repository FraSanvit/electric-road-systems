                constraints:
                    energy_eff: 2.6666667 # (0.001 Mkm/MWh) -> 0.50 kWh/km
            passenger_car_transport_ev:
                constraints:
                    energy_eff: 5.5555556 # (0.001 Mkm/MWh) -> 0.20 kWh/km
            passenger_car_transport_fcev:
                constraints:
                    energy_eff: 3.9722222 # (0.001 Mkm/MWh) = 1 / 0.84 kg/100km / 33.3 kWh/kgH2  -> 0.27972 kWh/km

            passenger_car_ev_battery:
