# CHARGING BEHAVIOUR

    # PASSENGER CAR CHARGING BEHAVIOUR
    fixed_charge_behaviour_base:
        techs:
            passenger_car_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=uncoordinated-charging-profile.csv
                    
    uncontrolled_behaviour_base:
        techs:
            passenger_car_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=uncoordinated-charging-profile.csv

    v1g_behaviour_base:
        techs:
            passenger_car_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=v1g-charging-profile.csv

    v2g_behaviour_base:
        techs:
            passenger_car_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=v2g-charging-profile.csv
                    energy_cap_max_time_varying: file=v2g-charging-profile.csv
    
    other_charging_behaviour:
        techs:
            light_duty_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=light-duty-transport-charging.csv

            bus_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=bus-charging.csv

            heavy_duty_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=heavy-duty-transport-charging.csv

            motorcycle_ev_battery:
                constraints:
                    energy_cap_max_time_varying_con: file=motorcycle-charging.csv

scenarios:
    fixed_charge: [v1g_stations, fixed_charging_stations, other_charging_stations, other_charging_behaviour]
    uncontrolled: [v1g_stations, uncontrolled_charging_stations, hydrogen_stations, other_charging_stations, other_charging_behaviour]
    v1g: [v1g_stations, hydrogen_stations, v1g_behaviour_base, other_charging_stations, other_charging_behaviour]
    v2g: [v1g_stations, v2g_stations, hydrogen_stations,v2g_behaviour_base, other_charging_stations, other_charging_behaviour]
    hydrogen: [hydrogen_stations]
    